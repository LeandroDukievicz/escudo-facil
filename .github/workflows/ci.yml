name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Testes do motor anti-golpe
        run: npm test -w @escudo/core
      - name: Typecheck
        run: npm run typecheck
      - name: Compatibilidade de versões Expo
        run: cd apps/mobile && npx expo install --check
      - name: Gerar motor JavaScript da landing
        run: npm run build:landing
      - name: Conferir módulos gerados
        run: git diff --exit-code -- apps/landing/site/js/core
